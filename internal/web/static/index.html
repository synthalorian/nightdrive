<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0c15">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<title>NightDrive</title>
<style>
  :root {
    --bg: #0b0c15;
    --panel: #121420;
    --panel-2: #1a1d2e;
    --text: #e7e9f5;
    --muted: #9aa3c0;
    --accent: #ff2a6d;
    --accent-2: #05d9e8;
    --accent-3: #d300c5;
    --shadow: 0 10px 30px rgba(0,0,0,.5);
    --border: rgba(255,255,255,.06);
    --hover-bg: rgba(255,255,255,.04);
  }
  [data-theme="light"] {
    --bg: #f5f6fa;
    --panel: #ffffff;
    --panel-2: #eef0f5;
    --text: #1a1d2e;
    --muted: #6b7089;
    --accent: #e91e63;
    --accent-2: #00bcd4;
    --accent-3: #9c27b0;
    --shadow: 0 10px 30px rgba(0,0,0,.12);
    --border: rgba(0,0,0,.08);
    --hover-bg: rgba(0,0,0,.04);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
    display: grid;
    grid-template-rows: 1fr auto;
    transition: background .2s, color .2s;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(1200px 800px at 10% -10%, #1a103c 0%, transparent 60%),
                radial-gradient(900px 600px at 120% 10%, #2a0e2e 0%, transparent 55%);
    opacity: .6;
    pointer-events: none;
    z-index: 0;
  }
  [data-theme="light"] body::before { opacity: .08; }
  .app { position: relative; z-index: 1; display: grid; grid-template-columns: 260px 1fr; gap: 16px; padding: 16px; overflow: hidden; height: 100%; }
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; padding: 8px; gap: 8px; }
    .sidebar { display: none; position: fixed; inset: 0; z-index: 100; background: var(--bg); padding: 20px; }
    .sidebar.open { display: flex; }
  }
  .sidebar, .main { background: linear-gradient(180deg, var(--panel), var(--panel-2)); border-radius: 16px; box-shadow: var(--shadow); border: 1px solid var(--border); }
  .sidebar { padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; font-size: 18px; }
  .brand .logo { width: 34px; height: 34px; border-radius: 10px; background: conic-gradient(from 200deg, var(--accent), var(--accent-2), var(--accent-3), var(--accent)); box-shadow: 0 0 20px rgba(255,42,109,.35); }
  .nav { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .nav button {
    text-align: left; background: transparent; border: 1px solid transparent; color: var(--muted);
    padding: 10px 12px; border-radius: 10px; cursor: pointer; font-weight: 600;
  }
  .nav button.active, .nav button:hover { color: var(--text); background: var(--hover-bg); border-color: var(--border); }
  .main { overflow: auto; padding: 20px 22px; }
  @media (max-width: 900px) { .main { padding: 14px 16px; } }
  .topbar { display: flex; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; }
  .search { flex: 1; max-width: 520px; position: relative; }
  .search input {
    width: 100%; padding: 10px 14px 10px 36px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--hover-bg); color: var(--text); outline: none;
  }
  .search::before { content: "🔎"; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); opacity: .7; }
  h2 { margin: 0 0 12px; font-weight: 800; letter-spacing: .04em; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
  @media (max-width: 600px) { .grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; } }
  .card {
    background: var(--hover-bg); border: 1px solid var(--border); border-radius: 14px;
    padding: 12px; cursor: pointer; transition: transform .12s ease, box-shadow .12s ease;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.2); border-color: rgba(128,128,128,.2); }
  .cover { width: 100%; aspect-ratio: 1; border-radius: 10px; background: linear-gradient(135deg, var(--panel-2), var(--bg)); display: grid; place-items: center; color: var(--muted); font-size: 12px; margin-bottom: 10px; overflow: hidden; }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .title { font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .meta { color: var(--muted); font-size: 12px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  tr:hover td { background: var(--hover-bg); }
  @media (max-width: 600px) {
    table { font-size: 13px; }
    th, td { padding: 8px 6px; }
    th:nth-child(1), td:nth-child(1) { display: none; }
  }
  .player {
    position: relative; z-index: 2;
    background: linear-gradient(180deg, var(--panel), var(--panel-2));
    border-top: 1px solid var(--border);
    padding: 12px 18px; display: grid; grid-template-columns: 220px 1fr 220px; gap: 18px; align-items: center;
    backdrop-filter: blur(8px);
  }
  @media (max-width: 900px) {
    .player { grid-template-columns: 1fr; gap: 10px; padding: 10px 12px; }
    .player .visualizer-wrap { display: none; }
  }
  .nowplaying { display: flex; align-items: center; gap: 12px; }
  .mini-cover { width: 52px; height: 52px; border-radius: 10px; background: linear-gradient(135deg, var(--panel-2), var(--bg)); flex: 0 0 auto; overflow: hidden; }
  .mini-cover img { width: 100%; height: 100%; object-fit: cover; }
  .nowplaying .info { min-width: 0; }
  .nowplaying .song { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nowplaying .artist { color: var(--muted); font-size: 12px; }
  .controls { display: flex; align-items: center; justify-content: center; gap: 14px; }
  .controls button {
    background: transparent; border: 1px solid var(--border); color: var(--text);
    border-radius: 999px; width: 40px; height: 40px; cursor: pointer; display: grid; place-items: center;
  }
  .controls button.primary { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 18px rgba(255,42,109,.45); }
  .progress { display: flex; align-items: center; gap: 10px; }
  .progress input[type=range] { flex: 1; }
  .visualizer-wrap { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
  .visualizer-canvas { width: 180px; height: 40px; border-radius: 8px; }
  .badge { display: inline-block; padding: 4px 8px; border-radius: 999px; background: rgba(5,217,232,.12); color: var(--accent-2); font-size: 12px; font-weight: 700; }
  .empty { color: var(--muted); padding: 30px 10px; text-align: center; }
  .theme-toggle { cursor: pointer; background: var(--hover-bg); border: 1px solid var(--border); color: var(--text); border-radius: 999px; width: 36px; height: 36px; display: grid; place-items: center; }
  .menu-btn { display: none; cursor: pointer; background: var(--hover-bg); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 8px 12px; font-weight: 700; }
  @media (max-width: 900px) { .menu-btn { display: inline-block; } }
  .lyrics-panel {
    position: fixed; right: 0; top: 0; bottom: 0; width: 380px; max-width: 90vw;
    background: linear-gradient(180deg, var(--panel), var(--panel-2));
    border-left: 1px solid var(--border); z-index: 50; padding: 20px;
    transform: translateX(100%); transition: transform .25s ease; overflow: auto;
  }
  .lyrics-panel.open { transform: translateX(0); }
  .lyrics-panel h3 { margin: 0 0 12px; }
  .lyrics-panel pre { white-space: pre-wrap; color: var(--muted); font-size: 14px; line-height: 1.6; }
  .lyrics-panel .close-btn { position: absolute; top: 12px; right: 12px; cursor: pointer; background: none; border: none; color: var(--text); font-size: 20px; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 45; display: none; }
  .overlay.show { display: block; }
  .bookmark-btn { cursor: pointer; background: var(--hover-bg); border: 1px solid var(--border); color: var(--accent); border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 700; }
  .sidebar-close { display: none; position: absolute; top: 12px; right: 12px; cursor: pointer; background: none; border: none; color: var(--text); font-size: 20px; }
  @media (max-width: 900px) { .sidebar-close { display: block; } }
</style>
</head>
<body>
  <div class="overlay" id="overlay"></div>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <button class="sidebar-close" id="sidebarClose">×</button>
      <div class="brand"><div class="logo" aria-hidden="true"></div> NightDrive</div>
      <nav class="nav" id="nav">
        <button class="active" data-view="tracks">Tracks</button>
        <button data-view="albums">Albums</button>
        <button data-view="artists">Artists</button>
        <button data-view="playlists">Playlists</button>
        <button data-view="podcasts">Podcasts</button>
        <button data-view="audiobooks">Audiobooks</button>
        <button data-view="search">Search</button>
      </nav>
      <div style="margin-top:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
        <div class="badge">v0.4.0</div>
        <div style="color:var(--muted); font-size:12px;">Self-hosted. No-cloud. Fast.</div>
        <button class="theme-toggle" id="themeToggle" title="Toggle theme">🌓</button>
      </div>
    </aside>
    <main class="main" id="main">
      <div class="topbar">
        <button class="menu-btn" id="menuBtn">☰ Menu</button>
        <div class="search"><input id="searchInput" placeholder="Search tracks, albums, artists…" autocomplete="off"></div>
        <div style="display:flex; gap:8px; align-items:center;">
          <button id="lyricsBtn" class="badge" style="cursor:pointer;display:none;">Lyrics</button>
          <button id="scanBtn" class="badge" style="cursor:pointer;background:rgba(255,42,109,.15);color:var(--accent)">Scan now</button>
        </div>
      </div>
      <div id="view"></div>
    </main>
  </div>

  <div class="lyrics-panel" id="lyricsPanel">
    <button class="close-btn" id="lyricsClose">×</button>
    <h3>Lyrics</h3>
    <div id="lyricsContent"><div class="empty">No lyrics available</div></div>
  </div>

  <footer class="player">
    <div class="nowplaying">
      <div class="mini-cover" id="miniCover"></div>
      <div class="info">
        <div class="song" id="nowTitle">—</div>
        <div class="artist" id="nowArtist">Ready to drive</div>
        <button class="bookmark-btn" id="bookmarkBtn" style="display:none;">Resume</button>
      </div>
    </div>
    <div>
      <div class="controls">
        <button id="prevBtn" title="Previous">⏮</button>
        <button id="playBtn" class="primary" title="Play/Pause">▶</button>
        <button id="nextBtn" title="Next">⏭</button>
      </div>
      <div class="progress">
        <span id="curTime">0:00</span>
        <input id="seek" type="range" min="0" max="0" value="0" step="1">
        <span id="totTime">0:00</span>
      </div>
    </div>
    <div class="visualizer-wrap">
      <canvas class="visualizer-canvas" id="vizCanvas" width="180" height="40"></canvas>
    </div>
    <audio id="audio" preload="none" crossorigin="anonymous"></audio>
  </footer>

<script>
(function(){
  const API = '/api';
  const $ = s => document.querySelector(s);
  const $$ = s => Array.from(document.querySelectorAll(s));
  let state = { view:'tracks', tracks:[], albums:[], artists:[], playlists:[], queue:[], idx:-1, audio:document.getElementById('audio'), currentTrack:null };
  const fmt = s => { if(!s||!isFinite(s)) return '0:00'; const m=Math.floor(s/60); const r=Math.floor(s%60); return m+':'+String(r).padStart(2,'0'); };

  async function getJSON(path){ const r=await fetch(API+path); if(!r.ok) throw new Error(r.status); return r.json(); }
  async function postJSON(path,body){ const r=await fetch(API+path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}); return r; }

  function setView(name){ state.view=name; $$('#nav button').forEach(b=>b.classList.toggle('active', b.dataset.view===name)); render(); }

  async function loadData(){
    try {
      if(state.view==='tracks') state.tracks = await getJSON('/tracks?limit=200');
      if(state.view==='albums') state.albums = await getJSON('/albums');
      if(state.view==='artists') state.artists = await getJSON('/artists');
      if(state.view==='playlists') state.playlists = await getJSON('/playlists');
      if(state.view==='podcasts') state.tracks = await getJSON('/tracks?mediaType=podcast&limit=200');
      if(state.view==='audiobooks') state.tracks = await getJSON('/tracks?mediaType=audiobook&limit=200');
    } catch(e){ console.error(e); }
    render();
  }

  function render(){
    const v = $('#view');
    if(state.view==='tracks' || state.view==='podcasts' || state.view==='audiobooks'){
      const title = state.view==='tracks'?'Tracks':state.view==='podcasts'?'Podcasts':'Audiobooks';
      if(!state.tracks.length){ v.innerHTML='<div class="empty">No '+title.toLowerCase()+' yet. Add music_dir to nightdrive.toml and hit Scan now.</div>'; return; }
      v.innerHTML = '<h2>'+title+'</h2><table><thead><tr><th>#</th><th>Title</th><th>Artist</th><th>Album</th><th>Time</th></tr></thead><tbody>'+
        state.tracks.map((t,i)=>`<tr data-id="${t.id}"><td>${i+1}</td><td>${esc(t.title)}</td><td>${esc(t.artistName||'')}</td><td>${esc(t.albumTitle||'')}</td><td>${fmt(t.duration)}</td></tr>`).join('')+
        '</tbody></table>';
      v.querySelectorAll('tbody tr').forEach(row=>row.addEventListener('click',()=>playTrack(Number(row.dataset.id))));
    } else if(state.view==='albums'){
      v.innerHTML = '<h2>Albums</h2><div class="grid">'+
        state.albums.map(a=>`<div class="card" data-id="${a.id}"><div class="cover">${a.coverArt?`<img src="${API}/tracks/${a.coverArt}/cover" alt="">`:'ALBUM'}</div><div class="title">${esc(a.title)}</div></div>`).join('')+
        '</div>';
      v.querySelectorAll('.card').forEach(c=>c.addEventListener('click',()=>showAlbum(Number(c.dataset.id))));
    } else if(state.view==='artists'){
      v.innerHTML = '<h2>Artists</h2><div class="grid">'+
        state.artists.map(a=>`<div class="card"><div class="cover">ARTIST</div><div class="title">${esc(a.name)}</div></div>`).join('')+
        '</div>';
    } else if(state.view==='playlists'){
      v.innerHTML = '<h2>Playlists</h2><div class="grid">'+
        state.playlists.map(p=>`<div class="card" data-id="${p.id}"><div class="cover">PLAYLIST</div><div class="title">${esc(p.name)}</div><div class="meta">${p.smartQuery?'smart':'static'}</div></div>`).join('')+
        '</div>';
      v.querySelectorAll('.card').forEach(c=>c.addEventListener('click',()=>showPlaylist(Number(c.dataset.id))));
    } else if(state.view==='search'){
      v.innerHTML = '<h2>Search results</h2><div id="searchResults"></div>';
    }
  }

  async function showAlbum(id){
    const tracks = await getJSON('/albums/'+id+'/tracks');
    state.tracks = tracks; state.view='tracks'; render();
  }
  async function showPlaylist(id){
    const tracks = await getJSON('/playlists/'+id+'/tracks');
    state.tracks = tracks; state.view='tracks'; render();
  }

  async function playTrack(id){
    const t = state.tracks.find(x=>x.id===id) || (await getJSON('/tracks/'+id));
    if(!t) return;
    state.currentTrack = t;
    state.audio.src = API+'/tracks/'+t.id+'/stream';
    state.audio.play().catch(()=>{});
    $('#nowTitle').textContent = t.title;
    $('#nowArtist').textContent = (t.artistName||'') + (t.albumTitle?' — '+t.albumTitle:'');
    $('#miniCover').innerHTML = `<img src="${API}/tracks/${t.id}/cover" alt="" onerror="this.style.display='none'">`;
    $('#playBtn').textContent = '⏸';
    $('#lyricsBtn').style.display = 'inline-block';
    state.queue = state.tracks.map(x=>x.id);
    state.idx = state.queue.indexOf(id);
    if(t.playbackPosition && t.playbackPosition > 10) {
      $('#bookmarkBtn').style.display = 'inline-block';
      $('#bookmarkBtn').textContent = 'Resume ' + fmt(t.playbackPosition);
      $('#bookmarkBtn').onclick = () => { state.audio.currentTime = t.playbackPosition; $('#bookmarkBtn').style.display = 'none'; };
    } else {
      $('#bookmarkBtn').style.display = 'none';
    }
    loadLyrics(t);
  }

  $('#playBtn').addEventListener('click', ()=>{
    if(!state.audio.src) return;
    if(state.audio.paused){ state.audio.play().catch(()=>{}); $('#playBtn').textContent='⏸'; }
    else { state.audio.pause(); $('#playBtn').textContent='▶'; }
  });
  $('#nextBtn').addEventListener('click', ()=>{
    if(state.queue.length && state.idx+1 < state.queue.length){ state.idx++; playTrack(state.queue[state.idx]); }
  });
  $('#prevBtn').addEventListener('click', ()=>{
    if(state.queue.length && state.idx>0){ state.idx--; playTrack(state.queue[state.idx]); }
  });
  state.audio.addEventListener('timeupdate', ()=>{
    $('#seek').value = String(Math.floor(state.audio.currentTime));
    $('#curTime').textContent = fmt(state.audio.currentTime);
    if(state.currentTrack && Math.floor(state.audio.currentTime) % 10 === 0) {
      postJSON('/tracks/'+state.currentTrack.id+'/position', {position: state.audio.currentTime}).catch(()=>{});
    }
  });
  state.audio.addEventListener('loadedmetadata', ()=>{
    $('#seek').max = String(Math.floor(state.audio.duration||0));
    $('#totTime').textContent = fmt(state.audio.duration);
  });
  state.audio.addEventListener('ended', ()=>$('#nextBtn').click());
  $('#seek').addEventListener('input', e=>{ state.audio.currentTime = Number(e.target.value); });

  $('#searchInput').addEventListener('keydown', async e=>{
    if(e.key!=='Enter') return;
    const q = e.target.value.trim(); if(!q) return;
    state.view='search'; state.tracks = await getJSON('/search?q='+encodeURIComponent(q)+'&limit=200'); render();
  });
  $('#scanBtn').addEventListener('click', async ()=>{ await fetch(API+'/scan',{method:'POST'}); setTimeout(loadData,800); });
  $('#nav').addEventListener('click', e=>{ if(e.target.dataset.view){ setView(e.target.dataset.view); loadData(); } });

  // Theme toggle
  const theme = localStorage.getItem('theme') || 'dark';
  document.documentElement.setAttribute('data-theme', theme);
  $('#themeToggle').addEventListener('click', ()=>{
    const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
  });

  // Mobile menu
  $('#menuBtn').addEventListener('click', ()=>{$('#sidebar').classList.add('open'); $('#overlay').classList.add('show');});
  $('#sidebarClose').addEventListener('click', ()=>{$('#sidebar').classList.remove('open'); $('#overlay').classList.remove('show');});
  $('#overlay').addEventListener('click', ()=>{$('#sidebar').classList.remove('open'); $('#overlay').classList.remove('show'); $('#lyricsPanel').classList.remove('open');});

  // Lyrics
  const lyricsCache = new Map();
  const LRU_MAX = 50;
  let lyricsLRU = JSON.parse(localStorage.getItem('lyricsLRU')||'[]');
  function getCachedLyrics(id) {
    for(let i=0;i<lyricsLRU.length;i++) if(lyricsLRU[i].id===id) return lyricsLRU[i].lyrics;
    return null;
  }
  function setCachedLyrics(id, lyrics) {
    lyricsLRU = lyricsLRU.filter(x=>x.id!==id);
    lyricsLRU.unshift({id, lyrics, ts: Date.now()});
    if(lyricsLRU.length > LRU_MAX) lyricsLRU = lyricsLRU.slice(0, LRU_MAX);
    localStorage.setItem('lyricsLRU', JSON.stringify(lyricsLRU));
  }

  async function loadLyrics(track) {
    let lyrics = track.lyrics || getCachedLyrics(track.id);
    if(!lyrics) {
      try {
        const data = await getJSON('/tracks/'+track.id+'/lyrics');
        lyrics = data.lyrics;
      } catch(e) {}
    }
    if(!lyrics && track.artistName && track.title) {
      try {
        const q = encodeURIComponent(track.artistName+' '+track.title);
        const r = await fetch('https://lrclib.net/api/search?q='+q);
        const data = await r.json();
        if(data && data.length && data[0].plainLyrics) {
          lyrics = data[0].plainLyrics;
          postJSON('/tracks/'+track.id+'/lyrics', {lyrics}).catch(()=>{});
        }
      } catch(e) {}
    }
    if(lyrics) setCachedLyrics(track.id, lyrics);
    $('#lyricsContent').innerHTML = lyrics ? `<pre>${esc(lyrics)}</pre>` : '<div class="empty">No lyrics available</div>';
  }

  $('#lyricsBtn').addEventListener('click', ()=>{$('#lyricsPanel').classList.add('open'); $('#overlay').classList.add('show');});
  $('#lyricsClose').addEventListener('click', ()=>{$('#lyricsPanel').classList.remove('open'); $('#overlay').classList.remove('show');});

  // Web Audio Visualizer
  let audioCtx, analyser, dataArray, source;
  function initVisualizer() {
    if(audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 64;
    analyser.smoothingTimeConstant = 0.8;
    source = audioCtx.createMediaElementSource(state.audio);
    source.connect(analyser);
    analyser.connect(audioCtx.destination);
    dataArray = new Uint8Array(analyser.frequencyBinCount);
    drawVisualizer();
  }
  function drawVisualizer() {
    requestAnimationFrame(drawVisualizer);
    const canvas = $('#vizCanvas');
    if(!canvas || !analyser) return;
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    analyser.getByteFrequencyData(dataArray);
    ctx.clearRect(0,0,w,h);
    const barCount = dataArray.length;
    const barW = w / barCount;
    for(let i=0;i<barCount;i++){
      const barH = (dataArray[i]/255)*h;
      const x = i*barW;
      const y = h-barH;
      const hue = 340 + (i/barCount)*60;
      ctx.fillStyle = 'hsl('+hue+', 90%, 60%)';
      ctx.fillRect(x,y,barW-1,barH);
    }
  }
  $('#playBtn').addEventListener('click', ()=>{
    if(!audioCtx) initVisualizer();
    if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  });

  // PWA Service Worker
  if('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(()=>{});
  }

  function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

  setView('tracks'); loadData();
})();
</script>
</body>
</html>
